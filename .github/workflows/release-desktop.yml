name: Verified Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-verify-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require tag to match package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release blocked: tag $env:GITHUB_REF_NAME does not match package v$version"
          }

      - run: npm ci
      - run: npm test
      # --publish never: electron-builder on tag tries GH publish and fails without GH_TOKEN mid-build
      - name: Build desktop (portable + Setup, no auto-publish)
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - run: npm run pack:customer
      - run: npm run release:asset
      - run: npm run release:verify -- --offline

      - name: Create or update verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktop = "dist-desktop-oauth/FB-Page-Studio-Desktop-v$version.exe"
          $desktopSha = "$desktop.sha256.txt"
          $setup = "dist-desktop-oauth/FB-Page-Studio-Setup-v$version.exe"
          $setupSha = "$setup.sha256.txt"
          $rel = "Tổng Hợp Tool/release-assets"
          $assets = @($desktop, $desktopSha)
          if (Test-Path $setup) { $assets += @($setup, $setupSha) }
          # Permanent "click = always latest" names (GitHub /releases/latest/download/…)
          foreach ($n in @(
            "FB-Page-Studio-Setup.exe",
            "FB-Page-Studio-Setup.exe.sha256.txt",
            "FB-Page-Studio-Desktop.exe",
            "FB-Page-Studio-Desktop.exe.sha256.txt"
          )) {
            $p = Join-Path $rel $n
            if (Test-Path $p) { $assets += $p }
          }
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --generate-notes --title "FB Page Studio $env:GITHUB_REF_NAME" --latest
          }
